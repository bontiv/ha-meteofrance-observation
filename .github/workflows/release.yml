name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release v${{ inputs.version }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      MANIFEST: custom_components/meteofrance_observation/manifest.json
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validate release request
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be dispatched from main." >&2
            exit 1
          fi
          python - <<'PY'
          import os
          import re
          import sys

          version = os.environ["VERSION"]
          match = re.fullmatch(
              r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?",
              version,
          )
          if not match:
              sys.exit("Version must use X.Y.Z or X.Y.Z-prerelease SemVer format.")
          prerelease = match.group(4)
          if prerelease and any(
              part.isdigit() and len(part) > 1 and part.startswith("0")
              for part in prerelease.split(".")
          ):
              sys.exit("Numeric prerelease identifiers must not contain leading zeroes.")
          PY
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Check release state
        id: state
        shell: bash
        run: |
          tag="v${VERSION}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists." >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            if ! git merge-base --is-ancestor "$tag" HEAD; then
              echo "Existing tag $tag is not part of main history." >&2
              exit 1
            fi
            git show "$tag:$MANIFEST" | python -c '
          import json, os, sys
          if json.load(sys.stdin).get("version") != os.environ["VERSION"]:
              sys.exit("Existing tag manifest version does not match the requested version.")
          '
            git checkout --quiet "$tag"
            echo "resume=true" >> "$GITHUB_OUTPUT"
          else
            echo "resume=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt awesomeversion
      - name: Check version ordering
        if: steps.state.outputs.resume != 'true'
        shell: bash
        run: |
          TAGS="$(git tag --list 'v*')" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from awesomeversion import AwesomeVersion, AwesomeVersionStrategy

          version = AwesomeVersion(os.environ["VERSION"])
          current = AwesomeVersion(
              json.loads(Path(os.environ["MANIFEST"]).read_text(encoding="utf-8"))["version"]
          )
          if version < current:
              sys.exit(f"Version {version} is lower than manifest version {current}.")
          released = [
              AwesomeVersion(tag[1:])
              for tag in os.environ["TAGS"].split()
              if AwesomeVersion(tag[1:]).strategy == AwesomeVersionStrategy.SEMVER
          ]
          if released and version <= max(released):
              sys.exit(f"Version {version} must be greater than latest tag v{max(released)}.")
          PY
      - name: Run test suite
        run: python -m pytest
      - name: Update manifest version
        if: steps.state.outputs.resume != 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          path = Path(os.environ["MANIFEST"])
          content = path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'(?m)^(\s*"version"\s*:\s*")[^"]+("\s*,?\s*)$',
              rf'\g<1>{os.environ["VERSION"]}\g<2>',
              content,
          )
          if count != 1:
              sys.exit("Expected exactly one manifest version field.")
          path.write_text(updated, encoding="utf-8")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("version") != os.environ["VERSION"]:
              sys.exit("Manifest version update failed.")
          PY
      - name: Commit, tag, and push version
        if: steps.state.outputs.resume != 'true'
        shell: bash
        run: |
          tag="${{ steps.state.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          if git diff --cached --quiet; then
            echo "Manifest already at $VERSION, tagging HEAD without a release commit."
          else
            git diff --cached --check
            git commit -m "chore(release): $tag"
          fi
          git tag -a "$tag" -m "Release $tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag:refs/tags/$tag"
      - name: Build and verify HACS archive
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import zipfile
          from pathlib import Path

          root = Path("custom_components/meteofrance_observation")
          archive = Path("meteofrance-observation.zip")
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as output:
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  if "__pycache__" in path.parts or path.suffix in {".pyc", ".pyo"}:
                      continue
                  output.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(archive) as packaged:
              names = packaged.namelist()
              print("\n".join(names))
              if "manifest.json" not in names or "__init__.py" not in names:
                  sys.exit("Archive is missing required root files.")
              if any(name.startswith("custom_components/") for name in names):
                  sys.exit("Archive contains an unexpected custom_components prefix.")
              if any("__pycache__" in name or name.endswith(".pyc") for name in names):
                  sys.exit("Archive contains compiled Python files.")
              manifest = json.loads(packaged.read("manifest.json"))
          if manifest.get("version") != os.environ["VERSION"]:
              sys.exit("Packaged manifest version does not match the requested version.")
          PY
      - name: Create GitHub Release
        shell: bash
        run: |
          tag="${{ steps.state.outputs.tag }}"
          options=(--repo "$GITHUB_REPOSITORY" --title "$tag" --generate-notes)
          if [[ "$VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$tag" meteofrance-observation.zip "${options[@]}"
